[package]
name = "invoice2excel"
version = "1.0.2"
description = "费用报销单 Excel 生成工具"
edition = "2021"

[features]
# release 构建必须启用（等价于 tauri build CLI 自动加的开关）：
# 不启用时 tauri 误判为开发模式，exe 会去连 devUrl (localhost:5173) 而不是加载内嵌的 ../ui 资源
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rust_xlsxwriter = "0.99.1"
serde = { version = "1", features = ["derive"] }
# 关闭默认 feature（brotli 资产压缩、dynamic-acl 等）：UI 资产很小压缩得不偿失，
# 权限能力是静态的也用不到 dynamic-acl；保留 wry（WebView 运行时）和 common-controls-v6（原生对话框样式）
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6"] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
